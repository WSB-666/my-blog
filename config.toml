baseURL = "https://wsb-666.github.io/my-blog/"
defaultContentLanguage = "zh"
locale = "zh-Hans"
title = "翠速小筑"
theme = "dream"
publishDir = "docs"
enableRobotsTXT = true
hasCJKLanguage = true
timeZone = "Asia/Shanghai"

# 文章固定链接：保持与旧站一致 /posts/<文件名>/
[permalinks]
posts = "/posts/:contentbasename/"

[params]
lightTheme = "emerald"
darkTheme = "forest"

backgroundImage = "img/background-fresh.jpg"

author = "WSB-666"
description = "记录技术学习、项目开发和生活感悟的个人博客"
headerTitle = "翠速小筑"
motto = "把每一次踩坑，都留成路标。"
favicon = "favicon.svg"

rss = true
siteStartYear = 2026

# 阅读体验
stickyNav = true
showTableOfContents = true
imageZoomableInPost = true
showPrevNextPost = true
showSummaryCoverInPost = true

# 自定义样式（柔化背景，保证正文可读）
[params.advanced]
customCSS = ["css/custom.css"]

[params.experimental]
jsDate = true
jsDateFormat = "yyyy年MM月dd日"

[markup]
[markup.goldmark.renderer]
unsafe = true

# 保持旧站的 /rss.xml 地址（Hugo 默认是 /index.xml）
[outputFormats.RSS]
baseName = "rss"
isPlainText = false
mediaType = "application/rss+xml"
